version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: placement_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: placement_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d placement_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: placement_tracker_api
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/placement_tracker
      PORT: 3000
      PYTHON_EXECUTABLE: python3
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
